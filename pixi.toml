[workspace]
name = "mapstorch"
version = "0.0.2"
description = "Development environment for the MapsTorch package"
authors = ["Xiangyu Yin <xyin@anl.gov>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

[tasks]
install = "python -m pip install -e ."

[dependencies]
python = "3.10.*"
pip = "*"

# Core scientific stack (from conda-forge)
numpy = "*"
h5py = "*"
tqdm = "*"

# IMPORTANT: bring C++ runtime into the env so we don't use /lib64/libstdc++.so.6
libstdcxx-ng = "*"
libgcc-ng = "*"

[pypi-dependencies]
torch = "*"

[feature.plot.dependencies]
matplotlib = "*"

[feature.plot.pypi-dependencies]
scienceplots = ">=2.2.0, <3"

[feature.widget.pypi-dependencies]
anywidget = "*"
traitlets = "*"

[feature.apps.dependencies]
plotly = "*"
pandas = "*"
scipy = "*"

[feature.apps.pypi-dependencies]
marimo = "*"

[environments]
default = { features = ["plot", "widget", "apps"] }
core = { features = [] }
